<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - DeliFood</title>
    <link rel="stylesheet" href="/assets/css/cartStyle.css">
</head>
<body>
<header class="header">
    <a href="/" class="logo"> <i class="fas fa-utensils"></i> DeliFood </a>
    <a href="/menu" class="btn">Go to Menu</a>
</header>

<section class="cart">
    <h1 class="menu">Your Cart</h1>
    <table class="cart-table">
        <thead>
        <tr>
            <th>Food Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        {{range .CartItems}}
        <tr>
            <td>{{.FoodName}}</td>
            <td>{{.FoodPrice}}</td>
            <td>
                <form action="/cart/update/{{.ID}}" method="post">
                    <input type="number" name="quantity" value="{{.Quantity}}" min="1" />
                    <button type="submit" class="btn">Update</button>
                </form>
            </td>
            <td>{{.TotalPrice}}</td>
            <td>
                <form action="/cart/remove/{{.ID}}" method="post">
                    <button type="submit" class="btn">Remove</button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="5">Your cart is empty.</td>
        </tr>
        {{end}}
        </tbody>
    </table>

    {{if .CartItems}}
    <div class="total-price">
        <h3>Total: ${{.TotalPrice}}</h3>
        <a href="/checkout" class="btn">Proceed to Checkout</a>
    </div>
    {{end}}
</section>

<script>
    // Fetch cart items from the server and display them
    async function fetchCartItems() {
        const response = await fetch('/cart');  // Fetch the user's cart from the backend
        const data = await response.json();

        if (data.cart_items && data.cart_items.length > 0) {
            document.getElementById('emptyCartMessage').style.display = 'none';
            const cartItemsContainer = document.getElementById('cartItemsContainer');
            cartItemsContainer.innerHTML = ''; // Clear the container before adding new items

            let totalPrice = 0;

            data.cart_items.forEach(item => {
                totalPrice += item.price * item.quantity;

                // Create HTML for each cart item
                const cartItemHTML = `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-item-info">
                            <h3>${item.name}</h3>
                            <p>Price: $${item.price}</p>
                            <input type="number" value="${item.quantity}" min="1" class="quantity-input" data-id="${item.id}">
                            <button class="btn remove-btn" data-id="${item.id}">Remove</button>
                        </div>
                    </div>
                `;
                cartItemsContainer.innerHTML += cartItemHTML;
            });

            // Display total price
            document.getElementById('totalPrice').textContent = totalPrice.toFixed(2);
        } else {
            document.getElementById('emptyCartMessage').style.display = 'block';
        }
    }

    // Handle updating quantity of items in the cart
    document.getElementById('cartItemsContainer').addEventListener('input', async (e) => {
        if (e.target.classList.contains('quantity-input')) {
            const newQuantity = e.target.value;
            const itemId = e.target.getAttribute('data-id');
            // Send the updated quantity to the backend
            await updateCartItemQuantity(itemId, newQuantity);
        }
    });

    // Handle removing an item from the cart
    document.getElementById('cartItemsContainer').addEventListener('click', async (e) => {
        if (e.target.classList.contains('remove-btn')) {
            const itemId = e.target.getAttribute('data-id');
            // Remove item from the cart on backend
            await removeCartItem(itemId);
        }
    });

    // Function to update item quantity
    async function updateCartItemQuantity(itemId, quantity) {
        await fetch(`/cart/update/${itemId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ quantity: quantity }),
        });

        // Re-fetch the cart items after update
        fetchCartItems();
    }

    // Function to remove item from the cart
    async function removeCartItem(itemId) {
        await fetch(`/cart/remove/${itemId}`, {
            method: 'DELETE',
        });

        // Re-fetch the cart items after removal
        fetchCartItems();
    }

    // Proceed to checkout
    document.getElementById('checkoutBtn').addEventListener('click', () => {
        window.location.href = '/checkout';  // Redirect to checkout page
    });

    // Fetch the cart items when the page loads
    fetchCartItems();
</script>

</body>
</html>
