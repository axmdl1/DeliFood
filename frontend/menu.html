<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DeliFood - Menu</title>

    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/menuStyle.css">
</head>
<body>

<header class="header">
    <a href="#" class="logo"> <i class="fas fa-utensils"></i> DeliFood </a>
    <a href="/" class="btn">Home</a>
</header>

<section class="functions">
    <h1 class="menu">Menu</h1>
    <form action="/menu" method="get" class="filter-sort-form">
        <select name="category">
            <option value="">All Categories</option>
            <option value="Burger">Burger</option>
            <option value="Biryani">Biryani</option>
        </select>
        <select name="sort">
            <option value="">Sort By</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name">Name</option>
        </select>
        <button type="submit" class="btn">Apply</button>
    </form>
</section>

<section class="packages" id="packages">
    <div class="box-container">
        <!-- Inside your menu.html -->
        {{range .Items}}
        <div class="box">
            <div class="image">
                <img src="{{.Image}}" alt="{{.Name}}">
                <h3> <i class="fas fa-utensils"></i> {{.Name}} </h3>
            </div>
            <div class="content">
                <div class="price">{{.Price}}</div>
                <p>{{.Description}}</p>
                <!-- Add to cart form -->
                <form action="/cart/add" method="POST">
                    <input type="hidden" name="food_id" value='{{.ID}}'>
                    <input type="number" name="quantity" value="1" min="1">
                    <button type="submit" class="btn">Add to Cart</button>
                </form>
            </div>
        </div>
        {{end}}

    </div>
</section>

<!-- Pagination -->
<div class="pagination">
    {{if gt .CurrentPage 1}}
    <a href="/menu?page={{sub .CurrentPage 1}}">Previous</a>
    {{end}}
    {{range $i := iter .TotalPages}}
    <a href="/menu?page={{$i}}" class="{{if eq $i $.CurrentPage}}active{{end}}">{{$i}}</a>
    {{end}}
    {{if lt .CurrentPage .TotalPages}}
    <a href="/menu?page={{add .CurrentPage 1}}">Next</a>
    {{end}}
</div>

</body>
</html>
