<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DeliFood</title>
    <link rel="stylesheet" href="/assets/css/menuStyle.css">
</head>
<body>

<header class="header">
    <a href="#" class="logo"> <i class="fas fa-utensils"></i> Admin Panel </a>
    <a href="/admin/user/role-panel" class="btn">Manage Users</a>
    <a href="/" class="btn">Go to Menu</a>
</header>

<section class="admin-panel">
    <h1 class="menu">Admin Panel</h1>
    <!-- Unified form for adding/editing food -->
    <form id="foodForm" class="filter-sort-form" action="/admin/panel/add" method="post" enctype="multipart/form-data">
        <!-- Hidden field for food ID (empty when adding new food) -->
        <input type="hidden" id="foodId" name="id" value="">
        <!-- Hidden field to store the current image filename -->
        <input type="hidden" id="currentImage" name="current_image" value="">

        <input type="text" id="foodName" name="name" placeholder="Food Name" required>
        <input type="text" id="foodCategory" name="category" placeholder="Category" required>

        <!-- File input for new image; not required in update mode -->
        <input type="file" id="foodImage" name="image_file" accept="image/*">

        <textarea id="foodDescription" name="description" placeholder="Description" required></textarea>
        <input type="number" id="foodPrice" name="price" placeholder="Price" step="0.01" required>
        <button type="submit" id="formSubmitBtn">Add Food</button>
    </form>

    <!-- List of foods -->
    <table class="food-table">
        <thead>
        <tr>
            <th>Image Filename</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="foodTableBody">
        {{range .Foods}}
        <tr>
            <td>{{.Image}}</td>
            <td>{{.Name}}</td>
            <td>{{.Category}}</td>
            <td>{{.Price}}</td>
            <td>{{.Description}}</td>
            <td>
                <button class="btn edit-btn" data-id="{{.ID.Hex}}" onclick="editFood(this)">Edit</button>
                <form action="/admin/panel/delete" method="post" style="display:inline;">
                    <input type="hidden" name="id" value="{{.ID.Hex}}">
                    <button type="submit" class="btn delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {{end}}
        </tbody>
    </table>
</section>

<script>
    // Populate form for editing food
    function editFood(button) {
        const row = button.closest("tr");
        const id = button.getAttribute("data-id");
        const image = row.children[0].textContent.trim();
        const name = row.children[1].textContent.trim();
        const category = row.children[2].textContent.trim();
        const price = row.children[3].textContent.trim();
        const description = row.children[4].textContent.trim();

        // Set form values
        document.getElementById("foodId").value = id;
        document.getElementById("foodName").value = name;
        document.getElementById("foodCategory").value = category;
        // Set the hidden current image value so we know the existing image filename
        document.getElementById("currentImage").value = image;
        // Clear the file input (file inputs cannot be pre-filled)
        document.getElementById("foodImage").value = "";
        document.getElementById("foodDescription").value = description;
        document.getElementById("foodPrice").value = price;

        // Change the form action and button text for update mode
        document.getElementById("foodForm").action = "/admin/panel/update";
        document.getElementById("formSubmitBtn").textContent = "Update Food";
    }
</script>

</body>
</html>
